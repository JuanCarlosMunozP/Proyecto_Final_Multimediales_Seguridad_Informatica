# ARCH-DEPLOY-001 — Perfil de despliegue para VPS en Producción (Linux AMD64 o ARM64)
# Ejecutar con: docker compose -f compose.yaml -f compose.vps.yaml up -d --build

services:
  postgres:
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=60
      -c log_connections=on
      -c log_disconnections=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/backups/postgres:/var/backups/postgresql
    mem_limit: 512m
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  fastapi:
    environment:
      DEPLOY_TARGET: vps
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CSRF_PROTECTION_ENABLED: "true"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-8}
    mem_limit: 512m
    cpus: 2.0
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs/vps:/etc/nginx/certs:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
