worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hardening: ocultar versión exacta de Nginx (SEG-006)
    server_tokens off;

    # Límites defensivos de cabeceras, cuerpo y timeouts
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 2 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Rate Limiting por IP (Defensa perimetral contra fuerza bruta y DoS)
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    log_format security_json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"ua":"$http_user_agent","rt":$request_time}';

    access_log /var/log/nginx/access.log security_json;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript model/gltf-binary;

    upstream fastapi_backend {
        server fastapi:8000;
        keepalive 8;
    }

    # Redirección obligatoria HTTP -> HTTPS (excepto desafíos ACME Let's Encrypt en VPS)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor principal HTTPS (TLS 1.2 / TLS 1.3 + Hardening)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:5m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de Seguridad HTTP (SEG-006 Hardening)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        # Bloquear acceso a archivos ocultos (.git, .env, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Endpoint de Autenticación con Rate Limit estricto (10 req/min por IP)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Resto de la API Backend (/api/v1/*)
        location /api/ {
            limit_req zone=api_limit burst=15 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Modelos 3D (.glb) con caché inmutable
        location /models/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # SPA / Entradas HTML del videojuego
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
